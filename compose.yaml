services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/week3/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/week4/migrations/V1_2__source_vocabulary_fields.sql:/docker-entrypoint-initdb.d/002-week4-vocabulary.sql:ro
      - ./database/week4/migrations/V1_3__quiz_question_snapshot.sql:/docker-entrypoint-initdb.d/003-week4-quiz.sql:ro
      - ./database/week4/migrations/V1_4__topic_deck_catalog.sql:/docker-entrypoint-initdb.d/004-week4-topic-catalog.sql:ro
      - ./database/week4/import/data/apply_topic_decks.sql:/docker-entrypoint-initdb.d/005-week4-topic-decks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random base64 JWT secret in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Copy .env.example to .env first}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Copy .env.example to .env first}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"

volumes:
  postgres_data:
